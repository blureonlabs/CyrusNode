[package]
name = "apollo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/blureonlabs/CyrusNode"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "apollo-api"
path = "src/bin/apollo-api.rs"

[[bin]]
name = "apollo-worker"
path = "src/bin/apollo-worker.rs"

[[bin]]
name = "apollo-cli"
path = "src/bin/apollo-cli.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Errors
thiserror = "2"
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time + IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = "1"

# Schemas
schemars = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Filesystem watcher (S1-T06: hot-reloading prompt loader)
notify = "6"

# DB (wired in S1-T02 — declared here so deps are stable across the crate)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# .env.local loading (CLI + binaries — opt-in via dotenvy::from_filename)
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.41", features = ["test-util", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
